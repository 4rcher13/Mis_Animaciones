name: Generate Space Invaders README animation

on:
  schedule:
    - cron: "0 0 * * *"  # una vez al día
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths:
      - "scripts/generate.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
        run: node scripts/generate.mjs

      - name: Commitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/space-invaders.svg
          git diff --staged --quiet || git commit -m "chore: actualizar animación de contribuciones"
          git push
